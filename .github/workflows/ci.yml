# CI — Qwen Gate (Bun 1.3.2 + npm install fallback)
# Trigger: push / PR ke master, atau dispatch manual
name: CI — Qwen Gate (Bun 1.3.2 + npm install fallback)
run-name: CI — ${{ github.run_number }} — ${{ github.ref_name }}
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Bun 1.3.2 (runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
          cache: bun

      - name: Environment info
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "bun: $(bun -v || echo 'bun missing')"
          echo "os: $(uname -a)"
          echo "lockfile: $(head -1 bun.lock || echo 'missing')"

      - name: Install dependencies (npm)
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Lint (Biome via bunx)
        run: bunx biome check src/

      - name: Typecheck (tsc --noEmit via bunx)
        run: bunx tsc --noEmit

      - name: Run tests (bun test)
        run: bun test

      - name: Run summary
        if: always()
        run: |
          cat <<EOF >> \$GITHUB_STEP_SUMMARY
          ## Summary
          - Workflow: \`${{ github.workflow }}\`
          - Run: \`${{ github.run_number }}\`
          - Ref: \`${{ github.ref }}\`
          - Branch: \`${{ github.ref_name }}\`
          - Runner OS: \`${{ runner.os }}\` / \`${{ runner.name }}\`
          - Commit: \`${{ github.sha }}\`
          - Status: \`${{ job.status }}\`
          EOF
